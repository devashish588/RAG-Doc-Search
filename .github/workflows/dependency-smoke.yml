# Dependency & Ingestion Smoke Test
#
# Validates that a clean Python 3.12 environment can install all dependencies,
# initialize Chroma and FastEmbed, ingest a document, and retrieve it.
# This prevents the class of issue where runtime packages silently go missing.
name: Dependency Smoke

on:
  push:
    branches: [feature/phase-06-reranker]
  pull_request:
    branches: [main, feature/phase-06-reranker]
  workflow_dispatch:

jobs:
  dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print Python environment info
        run: |
          source .venv/bin/activate
          python --version
          python -c "import sys; print(f'Executable: {sys.executable}'); print(f'Prefix: {sys.prefix}'); print(f'Base prefix: {sys.base_prefix}')"

      - name: Validate critical imports
        run: |
          source .venv/bin/activate
          python -c "import chromadb; print(f'chromadb {chromadb.__version__}')"
          python -c "import fastembed; print('fastembed OK')"
          python -c "import numpy; print(f'numpy {numpy.__version__}')"
          python -c "from rank_bm25 import BM25Okapi; print('rank-bm25 OK')"
          python -c "import langchain_chroma; print('langchain-chroma OK')"
          python -c "import sklearn; print(f'scikit-learn {sklearn.__version__}')"
          python -c "import flashrank; print('flashrank OK')"
          python -c "import prometheus_client; print('prometheus-client OK')"

      - name: Dependency check module
        run: |
          source .venv/bin/activate
          python -c "
          from backend.dependency_check import check_runtime_dependencies
          report = check_runtime_dependencies()
          print(f'Status: {report.status}')
          print(f'Missing critical: {report.missing_critical}')
          assert report.status in ('ok', 'degraded'), f'Dependency check failed: {report.status}'
          assert report.missing_critical == [], f'Missing: {report.missing_critical}'
          print('Dependency check PASSED')
          "

      - name: Chroma initialization
        run: |
          source .venv/bin/activate
          python -c "
          from backend.vector_store import get_vector_store, get_embeddings
          store = get_vector_store()
          embeddings = get_embeddings()
          vec = embeddings.embed_query('test query')
          print(f'Chroma OK, embedding dim={len(vec)}')
          "

      - name: Minimal ingestion
        run: |
          source .venv/bin/activate
          python -c "
          import uuid
          from langchain_core.documents import Document
          from backend.vector_store import get_vector_store, _VECTOR_LOCK

          store = get_vector_store()
          test_id = f'test_ci_{uuid.uuid4().hex[:8]}'
          doc_id = f'{test_id}:0'

          doc = Document(
              page_content='Dependency smoke test for CI pipeline validation.',
              metadata={'source': 'ci_test.txt', 'document_id': test_id, 'chunk': 0},
          )
          with _VECTOR_LOCK:
              store.add_documents(documents=[doc], ids=[doc_id])
              if callable(getattr(store, 'persist', None)):
                  store.persist()

          results = store.similarity_search('CI pipeline', k=1)
          assert len(results) >= 1, 'No results after ingestion'
          assert 'CI pipeline' in results[0].page_content
          print('Ingestion + retrieval PASSED')

          # Cleanup
          collection = getattr(store, '_collection', None)
          if collection:
              try:
                  collection.delete(ids=[doc_id])
              except Exception:
                  pass
          "

      - name: Run dependency tests
        run: |
          source .venv/bin/activate
          pip install pytest psutil
          python -m pytest tests/test_dependency_runtime.py -v --tb=short

      - name: Run full test suite
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short -x
